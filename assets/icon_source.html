<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1024px; height:1024px; }
  .icon {
    width:1024px; height:1024px; border-radius: 224px;
    background: linear-gradient(160deg, #2c2c34 0%, #1c1c22 55%, #131316 100%);
    position: relative; overflow: hidden;
  }
  .glow-g { position:absolute; width:640px; height:640px; border-radius:50%;
    background: radial-gradient(circle, rgba(48,209,88,0.30) 0%, rgba(48,209,88,0) 70%);
    top: -160px; right: -160px; }
  .glow-y { position:absolute; width:560px; height:560px; border-radius:50%;
    background: radial-gradient(circle, rgba(255,214,10,0.22) 0%, rgba(255,214,10,0) 70%);
    bottom: -160px; left: -140px; }
  svg { position:absolute; inset:0; width:100%; height:100%; }
</style></head>
<body>
  <div class="icon">
    <div class="glow-g"></div>
    <div class="glow-y"></div>
    <svg viewBox="0 0 200 200">
      <!-- What the telescope observes: a usage dial (semantic colors only) -->
      <circle cx="132" cy="58" r="30" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="8"/>
      <circle cx="132" cy="58" r="30" fill="none" stroke="#ffd60a" stroke-width="8"
        stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="88.7"
        transform="rotate(-90 132 58)"/>
      <circle cx="132" cy="58" r="18" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="8"/>
      <circle cx="132" cy="58" r="18" fill="none" stroke="#30d158" stroke-width="8"
        stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="99.5"
        transform="rotate(-90 132 58)"/>

      <!-- Tripod (three simple legs meeting at a hip point), drawn first (behind tube) -->
      <g stroke="#8a8c96" stroke-width="6.5" stroke-linecap="round" fill="none">
        <path d="M 92 128 L 60 182"/>
        <path d="M 92 128 L 92 186"/>
        <path d="M 92 128 L 126 180"/>
      </g>
      <circle cx="92" cy="128" r="7" fill="#8a8c96"/>

      <!-- Telescope tube: tapered barrel from eyepiece to objective lens,
           angled up-right toward the dial -->
      <g transform="rotate(-40 92 128)">
        <!-- tapered body via polygon: narrow at eyepiece(left), wide at lens(right) -->
        <polygon points="46,120 46,136 138,146 138,110" fill="#eceef2"/>
        <!-- eyepiece cap -->
        <rect x="38" y="117" width="12" height="22" rx="5" fill="#b8bac2"/>
        <!-- focuser knob -->
        <circle cx="80" cy="128" r="7" fill="#9a9ca4"/>
        <!-- objective lens rim -->
        <circle cx="140" cy="128" r="22" fill="#15151a" stroke="#eceef2" stroke-width="7"/>
        <circle cx="140" cy="128" r="10" fill="#0a0a0d"/>
      </g>
    </svg>
  </div>
</body>
</html>
