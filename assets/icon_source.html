<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1024px; height:1024px; }
  .icon {
    width:1024px; height:1024px; border-radius: 224px;
    background: linear-gradient(160deg, #2c2c34 0%, #1c1c22 55%, #131316 100%);
    position: relative; overflow: hidden;
    display:flex; align-items:center; justify-content:center;
  }
  /* soft ambient glows, semantic colors only (green=ok, amber=caution) */
  .glow-g { position:absolute; width:620px; height:620px; border-radius:50%;
    background: radial-gradient(circle, rgba(48,209,88,0.35) 0%, rgba(48,209,88,0) 70%);
    top: -120px; left: -140px; }
  .glow-y { position:absolute; width:560px; height:560px; border-radius:50%;
    background: radial-gradient(circle, rgba(255,214,10,0.28) 0%, rgba(255,214,10,0) 70%);
    bottom: -140px; right: -120px; }

  .rings { position:relative; width:640px; height:640px; }
  svg { width:640px; height:640px; }

  .center-dot { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:70px; height:70px; border-radius:50%;
    background: #f5f5f7;
    box-shadow: 0 0 0 14px rgba(245,245,247,0.08);
  }
</style></head>
<body>
  <div class="icon">
    <div class="glow-g"></div>
    <div class="glow-y"></div>
    <div class="rings">
      <svg viewBox="0 0 200 200">
        <!-- outer ring: ChatGPT weekly, amber, 53% -->
        <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="14"/>
        <circle cx="100" cy="100" r="88" fill="none" stroke="#ffd60a" stroke-width="14"
          stroke-linecap="round"
          stroke-dasharray="552.9" stroke-dashoffset="259.9"
          transform="rotate(-90 100 100)"/>
        <!-- inner ring: Claude 5h session, green, 12% -->
        <circle cx="100" cy="100" r="62" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="14"/>
        <circle cx="100" cy="100" r="62" fill="none" stroke="#30d158" stroke-width="14"
          stroke-linecap="round"
          stroke-dasharray="389.6" stroke-dashoffset="342.8"
          transform="rotate(-90 100 100)"/>
      </svg>
      <div class="center-dot"></div>
    </div>
  </div>
</body>
</html>
